name: Release Docker image

# 推 v* tag 时构建 linux/amd64 + linux/arm64，并推送到 Docker Hub。
#
# 凭据来自 `deploy` 环境（Settings -> Environments -> deploy）：
#   secrets.DOCKERHUB_USERNAME
#   secrets.DOCKERHUB_TOKEN
#   vars.DOCKERHUB_IMAGE          例如 tryao/emqx-oss
#
# 为什么用原生 arm64 runner 而不是 QEMU：这个镜像在 Dockerfile 里从源码编译
# EMQX（deploy/docker/Dockerfile -> make emqx-tgz），QEMU 模拟下会慢到接近
# GitHub 的 6 小时上限。public repo 的 arm64 runner 是免费的。
#
# tag 必须以 apps/emqx/include/emqx_release.hrl 里的 EMQX_RELEASE_CE 开头，
# 这是 emqx_release:version/0 的前缀规则（不满足会在启动时抛 version_mismatch），
# pkg-vsn.sh 会强制校验，precheck 把它提前到几秒内失败。
#
# 每个架构的 build job 会推送 <version>-amd64 / <version>-arm64 两个 staging
# tag，merge 完成后它们会保留在 Docker Hub 上（想拉单个架构时反而有用）。
# 曾尝试用 Docker Hub API 删掉它们，但 DELETE
# https://hub.docker.com/v2/repositories/<ns>/<repo>/tags/<tag>/
# 用 PAT 做 basic auth 返回 401（2026-09-30 实测），所以不做这一步，
# 也不留一个每次都失败的步骤。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '要发布的镜像 tag，例如 5.8.9-rc1（带 - 后缀不会打 latest）'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-docker-${{ github.ref }}
  cancel-in-progress: false

env:
  PROFILE: emqx

jobs:
  # 把「tag 写错」和「dashboard asset 还没发布」这两类问题提前到几秒内失败，
  # 而不是等 docker build 跑了十几分钟才在容器里以 unzip 报错收场。
  precheck:
    name: Precheck
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      latest: ${{ steps.version.outputs.latest }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve image version
        id: version
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RAW='${{ inputs.version }}'
          else
            RAW="${GITHUB_REF_NAME}"
          fi
          VERSION="${RAW#v}"
          if [ -z "$VERSION" ]; then
            echo "::error::无法确定版本号"
            exit 1
          fi
          # 带预发布后缀（5.8.9-rc1）的不移动 latest
          case "$VERSION" in
            *-*) LATEST=false ;;
            *)   LATEST=true  ;;
          esac
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
          echo "源 tag: '$RAW' -> version=$VERSION, latest=$LATEST"

      - name: Verify version is compatible with emqx_release.hrl
        run: |
          set -euo pipefail
          RELEASE="$(grep -E 'define.+EMQX_RELEASE_CE' apps/emqx/include/emqx_release.hrl | cut -d '"' -f2)"
          VERSION='${{ steps.version.outputs.version }}'
          echo "emqx_release.hrl: $RELEASE"
          echo "镜像版本:         $VERSION"
          # 与 emqx_release:version/0 一致：只要求以 EMQX_RELEASE_CE 开头，
          # 所以 v5.8.9 / v5.8.9-build.1 / v5.8.90 都可以，5.9.0 不行。
          case "$VERSION" in
            "$RELEASE"*)
              echo "版本兼容 OK"
              ;;
            *)
              echo "::error::版本不兼容：'$VERSION' 不以 '$RELEASE' 开头。"
              echo "::error::emqx_release:version/0 会抛 version_mismatch，EMQX 起不来。"
              echo "::error::请先把 apps/emqx/include/emqx_release.hrl 里的 EMQX_RELEASE_CE 改成 '$VERSION'，提交后再打 tag。"
              exit 1
              ;;
          esac

      - name: Verify dashboard release asset exists
        run: |
          set -euo pipefail
          DASH_REPO="$(sed -nE "s/^DASHBOARD_REPO='([^']+)'.*/\1/p" scripts/get-dashboard.sh)"
          DASH_VER="$(sed -nE 's/^export EMQX_DASHBOARD_VERSION \?= (.*)$/\1/p' Makefile)"
          URL="https://github.com/${DASH_REPO}/releases/download/${DASH_VER}/emqx-dashboard-${DASH_VER}.zip"
          echo "dashboard 来源:  ${DASH_REPO} @ ${DASH_VER}"
          echo "检查:            ${URL}"
          if ! curl -fsSLI -o /dev/null "$URL"; then
            echo "::error::dashboard asset 不存在：${URL}"
            echo "::error::请先给 ${DASH_REPO} 推 ${DASH_VER} tag，等它的 release workflow 发布 asset 后再重试。"
            exit 1
          fi
          echo "dashboard asset OK"

  build:
    name: Build ${{ matrix.arch }}
    needs: [precheck]
    runs-on: ${{ matrix.runner }}
    environment: deploy
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          # pkg-vsn.sh 靠容器里的 git describe 读 tag 推导 PKG_VSN，
          # 浅克隆会让版本退化成 5.8.9-g<sha> 这种形式。
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push ${{ matrix.platform }}
        env:
          DOCKER_REGISTRY: docker.io
          DOCKER_PLATFORMS: ${{ matrix.platform }}
          DOCKER_PUSH: 'true'
          # 多平台不能 --load；make_docker 里 DOCKER_LOAD 默认是 true，必须显式关掉
          DOCKER_LOAD: 'false'
          # 覆盖默认的 <DOCKER_ORG>/<PROFILE>，因为镜像名是 emqx-oss 而不是 emqx
          EMQX_IMAGE_TAG: ${{ vars.DOCKERHUB_IMAGE }}:${{ needs.precheck.outputs.version }}-${{ matrix.arch }}
        run: make emqx-docker

  merge:
    name: Merge manifest and smoke test
    needs: [precheck, build]
    runs-on: ubuntu-24.04
    environment: deploy
    steps:
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create multi-arch manifest
        env:
          IMAGE: ${{ vars.DOCKERHUB_IMAGE }}
          VERSION: ${{ needs.precheck.outputs.version }}
          LATEST: ${{ needs.precheck.outputs.latest }}
        run: |
          set -euo pipefail
          TAGS=(-t "${IMAGE}:${VERSION}")
          if [ "${LATEST}" = "true" ]; then
            TAGS+=(-t "${IMAGE}:latest")
          fi
          docker buildx imagetools create "${TAGS[@]}" \
            "${IMAGE}:${VERSION}-amd64" \
            "${IMAGE}:${VERSION}-arm64"
          echo "=== ${IMAGE}:${VERSION} ==="
          docker buildx imagetools inspect "${IMAGE}:${VERSION}"

      - name: Smoke test - dashboard Kafka entry present in image
        env:
          IMAGE: ${{ vars.DOCKERHUB_IMAGE }}
          VERSION: ${{ needs.precheck.outputs.version }}
        run: |
          set -euo pipefail
          docker pull --platform linux/amd64 "${IMAGE}:${VERSION}"
          docker run --rm --entrypoint sh "${IMAGE}:${VERSION}" -c '
            set -e
            d="$(ls -d /opt/emqx/lib/emqx_dashboard-*/priv/www)"
            echo "dashboard dir: $d"
            sed "s/^/  /" "$d/version"
            ls "$d/static/img/" | grep -i kafka_producer
            grep -q "Kafka 生产者" "$d"/static/js/app*.js
            echo "smoke test OK"
          '
