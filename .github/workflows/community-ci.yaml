name: Community CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-22.04
    container: docker.io/tryao/emqx-otp-oss:27.3.4.19-emqx-oss.1-1-debian13@sha256:f80234a9682efa39091c2b8a868a8acdc54989e162be8193f61c3db07eb1448c
    env:
      PROFILE: emqx
      BUILD_WITHOUT_QUIC: "1"
      DOWNLOAD_I18N_TRANSLATIONS: "false"
      ERL_FLAGS: "+IOp 4 +IOt 4"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Trust checkout directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Verify source licenses
        run: test -z "$(find apps -name BSL.txt -print -quit)"
      - name: Verify pinned Apache-2.0 security OTP builder
        run: check-emqx-otp
      - name: Compile community edition and tests
        shell: bash
        run: |
          set -euo pipefail
          make emqx-compile test-compile 2>&1 | tee community-compile.log
          # rebar3 may swallow plugin failures and leave stale compiler workers.
          if grep -F 'Errors loading plugin' community-compile.log; then
            exit 1
          fi
      - name: Verify compiled security dependencies
        run: bash scripts/test/check-security-deps.sh
      - name: Verify test template map support
        run: |
          erl -pa _build/test/lib/bbmustache/ebin -noshell -eval '
            <<"ok">> = bbmustache:render(<<"{{name}}">>, #{<<"name">> => <<"ok">>}, [{key_type, binary}]),
            halt().'
      - name: Run session registry regression tests
        run: ./rebar3 ct --name test@127.0.0.1 --suite apps/emqx/test/emqx_cm_registry_keeper_SUITE.erl
      - name: Run esockd file limit regression test
        run: |
          ulimit -n 8192
          ./rebar3 ct --name test@127.0.0.1 --suite apps/emqx/test/emqx_esockd_limit_SUITE.erl
      - name: Run plugin installation security regressions
        run: |
          erl -pa _build/test/lib/*/ebin -noshell -eval 'case eunit:test(emqx_plugins, [verbose]) of ok -> halt(0); _ -> halt(1) end.'
          ./rebar3 ct --name test@127.0.0.1 --suite apps/emqx_plugins/test/emqx_plugins_SUITE.erl --case t_allow_ttl_expires,t_allow_sha256_match,t_allow_sha256_mismatch,t_allow_sha256_undefined_accepts_any,t_tar_path_traversal
      - name: Run TCP listener tests
        run: ./rebar3 ct --name test@127.0.0.1 --suite apps/emqx/test/emqx_listeners_SUITE.erl --case t_max_conns_tcp,t_current_conns_tcp
      - name: Run community boot tests
        run: |
          ./rebar3 ct --name test@127.0.0.1 --suite apps/emqx_machine/test/emqx_machine_SUITE.erl --case t_sorted_reboot_apps
          ./rebar3 ct --name test@127.0.0.1 --suite apps/emqx_machine/test/emqx_machine_SUITE.erl --case t_shutdown_reboot
      - name: Assemble community release
        run: make emqx-rel
      - name: Verify QUIC dependency is absent
        run: test -z "$(find _build/emqx/rel/emqx/lib -maxdepth 1 -name 'quicer-*' -print -quit)"
      - name: Verify more than 1024 MQTT connections
        run: |
          ulimit -n 8192
          release_bin=_build/emqx/rel/emqx/bin/emqx
          "$release_bin" start
          trap '"$release_bin" stop' EXIT
          python3 scripts/test/check-connection-capacity.py
